<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Computer-use manager verification</title><style>
:root{--dsw-alias-bg-base:#fff;--dsw-alias-bg-layer-1:#f8f9fb;--dsw-alias-border-l1:#d9dde5;--dsw-alias-border-l2:#e7e9ee;--dsw-alias-label-primary:#25262b;--dsw-alias-label-secondary:#747982;--dsw-alias-state-success-primary:#16845b;--dsw-alias-state-error-primary:#c83943;--dsw-alias-state-warn-primary:#9d6b11;font-family:Arial,"Microsoft YaHei",sans-serif}html,body,#app{height:100%;margin:0}button{font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:default}.test-button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;border:1px solid #d9dde5;border-radius:6px;padding:5px 11px;background:#fff;color:#25262b;white-space:nowrap;font-size:13px}.test-button[data-variant=primary]{background:#356bf5;color:#fff;border-color:#356bf5}.test-switch{width:36px;height:20px;border:0;border-radius:10px;background:#bbc0ca;padding:2px;flex-shrink:0}.test-switch span{display:block;background:white;border-radius:50%;height:16px;width:16px;transition:transform .1s}.test-switch[aria-checked=true]{background:#356bf5}.test-switch[aria-checked=true] span{transform:translateX(16px)}.test-dot{display:inline-block;background:currentColor;border-radius:50%;flex-shrink:0}.test-backdrop{position:fixed;inset:0;background:#0005;display:flex;align-items:center;justify-content:center;padding:20px}.test-dialog{background:#fff;border:1px solid #ddd;border-radius:8px;padding:22px;width:min(480px,100%);box-sizing:border-box}.test-dialog h2{margin-top:0;font-size:18px}.test-dialog-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
</style></head><body><div id="app"></div><script src="harness.bundle.js"></script><script src="../client.js"></script></body></html>
