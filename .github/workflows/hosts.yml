name: Host compatibility

# Verifies the packed manager against the newest DSH release candidate (required) and the newest
# alpha (early warning). Versions are read from npm on every run, and the weekly schedule catches
# new DSH releases without a push.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1'

permissions:
  contents: read

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rc: ${{ steps.pick.outputs.rc }}
      alpha: ${{ steps.pick.outputs.alpha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: pick
        run: node verification/pick-hosts.mjs | tee -a "$GITHUB_OUTPUT"

  hosts:
    needs: pick
    runs-on: windows-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.channel == 'alpha' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: rc
            version: ${{ needs.pick.outputs.rc }}
          - channel: alpha
            version: ${{ needs.pick.outputs.alpha }}
    name: DSH ${{ matrix.channel }} ${{ matrix.version || '(none newer than rc)' }}
    steps:
      - uses: actions/checkout@v4
        if: matrix.version != ''
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: matrix.version != ''
        with:
          node-version: 24
      - name: Install the packed manager with this DSH's host packages
        if: matrix.version != ''
        shell: bash
        run: bash verification/host-project.sh "${{ matrix.version }}" "$RUNNER_TEMP/host"
      - name: Check loading, host contracts and inline-install gating
        if: matrix.version != ''
        shell: bash
        run: node verification/check-hosts.mjs "$RUNNER_TEMP/host"
      - name: Warn on alpha failure
        if: failure() && matrix.channel == 'alpha'
        shell: bash
        run: echo "::warning::DSH ${{ matrix.version }} breaks the manager. Fix before it reaches RC."
